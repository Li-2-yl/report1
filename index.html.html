  &lt;script&gt;
    var myState = { answered1: false, answered2: false };
    function saveMyState() {
      window.parent.postMessage({ type: 'saveState', state: myState }, '*');
    }
    function checkAnswer(btn, isCorrect, tipId) {
      btn.parentElement.querySelectorAll('.option-btn').forEach(b =&gt; b.disabled = true);
      if(isCorrect) {
        btn.classList.add('correct');
        document.getElementById(tipId).style.display = 'block';
        if(tipId === 'tip1') myState.answered1 = true;
        if(tipId === 'tip2') myState.answered2 = true;
        saveMyState();
      } else {
        btn.style.background = '#f8d7da';
        btn.style.color = '#721c24';
        document.getElementById(tipId).textContent = '❌ 不对哦，再想想太阳从哪边升起？';
        document.getElementById(tipId).style.color = '#dc3545';
        document.getElementById(tipId).style.display = 'block';
      }
    }
    window.addEventListener('message', function(e) {
      if (e.data &amp;&amp; e.data.type === 'restoreState') {
        var state = e.data.state;
        if(state.answered1) {
          document.getElementById('tip1').style.display = 'block';
          document.querySelectorAll('.question-card')[0].querySelectorAll('.option-btn').forEach((b,i) =&gt; {
            b.disabled = true;
            if(i===0) b.classList.add('correct');
          });

        if(state.answered2) {
          document.getElementById('tip2').style.display = 'block';
          document.querySelectorAll('.question-card')[1].querySelectorAll('.option-btn').forEach((b,i) =&gt; {
            b.disabled = true;
            if(i===1) b.classList.add('correct');
          });
        }
      }
    });

    &lt;h2 class=&quot;text-[32px] font-bold text-text mb-4&quot;&gt;🏆 方位抢答大挑战&lt;/h2&gt;
    &lt;div class=&quot;question-box&quot;&gt;
      &lt;p id=&quot;q-text&quot; class=&quot;text-[26px] font-bold&quot;&gt;请听题：太阳从哪边升起？&lt;/p&gt;
    &lt;/div&gt;
    &lt;p class=&quot;text-[20px] text-text mb-4 text-center&quot;&gt;知道答案的同学快速举手，答对得1分！&lt;/p&gt;
    &lt;div class=&quot;flex justify-center gap-5 mb-4&quot;&gt;
      &lt;button class=&quot;big-dir-btn&quot; onclick=&quot;chooseDir(this, 0)&quot;&gt;东&lt;/button&gt;
      &lt;button class=&quot;big-dir-btn&quot; onclick=&quot;chooseDir(this, 1)&quot;&gt;南&lt;/button&gt;
      &lt;button class=&quot;big-dir-btn&quot; onclick=&quot;chooseDir(this, 2)&quot;&gt;西&lt;/button&gt;
      &lt;button class=&quot;big-dir-btn&quot; onclick=&quot;chooseDir(this, 3)&quot;&gt;北&lt;/button&gt;
    &lt;/div&gt;
    &lt;p id=&quot;feedback&quot; class=&quot;text-[20px] text-center font-bold mb-3&quot; style=&quot;min-height:30px&quot;&gt;&lt;/p&gt;
    &lt;div class=&quot;text-center&quot;&gt;
      &lt;button class=&quot;next-btn&quot; onclick=&quot;nextQuestion()&quot;&gt;下一题 👉&lt;/button&gt;
    &lt;/div&gt;
    &lt;p class=&quot;text-[18px] text-text/60 text-center mt-3&quot;&gt;得分：&lt;span id=&quot;score&quot; class=&quot;text-accent font-bold&quot;&gt;0&lt;/span&gt; 分 | 第 &lt;span id=&quot;q-num&quot; class=&quot;text-primary font-bold&quot;&gt;1&lt;/span&gt;/5 题&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
    var questions = [
      {q:&quot;请听题：太阳从哪边升起？&quot;, a:0},
      {q:&quot;请听题：地图上，上方是什么方向？&quot;, a:3},
      {q:&quot;请听题：太阳从哪边落下？&quot;, a:2},
      {q:&quot;请听题：早上面向东，右手边是？&quot;, a:1},
      {q:&quot;请听题：地图规则「左西」，右边是？&quot;, a:0}
    ];
    var gameState = { current: 0, score: 0, answered: false };
    function saveMyState() {
      window.parent.postMessage({ type: 'saveState', state: gameState }, '*');
    }
    function chooseDir(btn, idx) {
      if(gameState.answered) return;
      gameState.answered = true;
      document.querySelectorAll('.big-dir-btn').forEach(b =&gt; b.disabled = true);
      var correct = questions[gameState.current].a;
      if(idx === correct) {
        btn.classList.add('correct');
        document.getElementById('feedback').textContent = '✅ 答对啦！真棒！';
        document.getElementById('feedback').style.color = '#5a9367';
        gameState.score++;
        document.getElementById('score').textContent = gameState.score;
      } else {
        btn.style.background = '#f8d7da';
        btn.style.borderColor = '#dc3545';
        btn.style.color = '#dc3545';
        document.querySelectorAll('.big-dir-btn')[correct].classList.add('correct');
        document.getElementById('feedback').textContent = '❌ 不对哦，正确答案是' + ['东','南','西','北'][correct];
        document.getElementById('feedback').style.color = '#dc3545';
      }
      saveMyState();
    }
    function nextQuestion() {
      if(gameState.current &gt;= questions.length - 1) {
        document.getElementById('q-text').textContent = '🎉 游戏结束！一共答对了' + gameState.score + '题，大家都很棒！';
        document.querySelectorAll('.big-dir-btn').forEach(b =&gt; b.style.display = 'none');
        document.querySelector('.next-btn').style.display = 'none';
        document.getElementById('feedback').textContent = '';
        gameState.finished = true;
        saveMyState();
        return;
      }
      gameState.current++;
      gameState.answered = false;
      document.getElementById('q-num').textContent = gameState.current + 1;
      document.getElementById('q-text').textContent = questions[gameState.current].q;
      document.getElementById('feedback').textContent = '';
      document.querySelectorAll('.big-dir-btn').forEach(b =&gt; {
        b.classList.remove('correct');
        b.disabled = false;
        b.style.background = 'white';
        b.style.borderColor = '#e6a23c';
        b.style.color = '#e6a23c';
        b.style.display = 'block';
      });
      saveMyState();
    }
    window.addEventListener('message', function(e) {
      if (e.data &amp;&amp; e.data.type === 'restoreState') {
        gameState = e.data.state;
        document.getElementById('score').textContent = gameState.score;
        document.getElementById('q-num').textContent = gameState.current + 1;
        document.getElementById('q-text').textContent = gameState.finished ? '🎉 游戏结束！一共答对了' + gameState.score + '题，大家都很棒！' : questions[gameState.current].q;
        if(gameState.finished || gameState.current &gt;= questions.length - 1 &amp;&amp; gameState.answered) {
          document.querySelectorAll('.big-dir-btn').forEach(b =&gt; b.style.display = 'none');
          document.querySelector('.next-btn').style.display = 'none';
        }
      }
    });
  &lt;/script&gt;

&lt;/template&gt;
